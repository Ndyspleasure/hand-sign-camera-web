[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "20"

[functions]
node_bundler = "esbuild"

# The old Netlify address redirects to the custom domain. Its /sw.js is swapped
# for a worker that clears the old cached app, so returning visitors whose
# service worker would otherwise keep serving it also reach the redirect.
[[redirects]]
from = "https://vanillate-hand-sign-camera.netlify.app/sw.js"
to = "/retire-sw.js"
status = 200
force = true

[[redirects]]
from = "https://vanillate-hand-sign-camera.netlify.app/*"
to = "https://handsign.vanillate.id/:splat"
status = 301
force = true

[[redirects]]
from = "http://vanillate-hand-sign-camera.netlify.app/*"
to = "https://handsign.vanillate.id/:splat"
status = 301
force = true

# The app moved from / to /camera/. Old deep links keep working.
[[redirects]]
from = "/"
to = "/camera/?guide=:guide"
status = 301
force = true
query = { guide = ":guide" }

[[redirects]]
from = "/"
to = "/camera/?demo"
status = 301
force = true
query = { demo = ":demo" }

[[redirects]]
from = "/"
to = "/camera/?layout=:layout"
status = 301
force = true
query = { layout = ":layout" }

[[redirects]]
from = "/index.html"
to = "/"
status = 301

[[redirects]]
from = "/camera/index.html"
to = "/camera/"
status = 301

# No SPA catch-all: unknown URLs get a real 404 (dist/404.html).

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
Strict-Transport-Security = "max-age=31536000"

[[headers]]
for = "/*.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/mediapipe/*"
[headers.values]
# Not content-hashed: revalidate so the runtime always matches the bundled JS.
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/og/*"
[headers.values]
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/icons/*"
[headers.values]
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/llms.txt"
[headers.values]
Content-Type = "text/plain; charset=utf-8"
